# ====================================================
# Render Blueprint Specification for BASIC Parser Studio
# https://render.com/docs/blueprint-spec
# ====================================================

services:
  # ----------------------------------------------------
  # 1. Backend Docker Web Service
  # Builds C Flex/Bison compiler & runs Express REST API
  # ----------------------------------------------------
  - type: web
    name: basic-parser-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: PARSER_BIN_PATH
        value: /app/parser/basic_parser
      # Set FRONTEND_URL to your deployed frontend domain once created:
      # e.g. https://basic-parser-frontend.onrender.com
      - key: FRONTEND_URL
        sync: false

  # ----------------------------------------------------
  # 2. Frontend Static Site
  # Builds Vite + React SPA
  # ----------------------------------------------------
  - type: web
    name: basic-parser-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set VITE_API_URL to your deployed backend URL during build:
      # e.g. https://basic-parser-backend.onrender.com
      - key: VITE_API_URL
        sync: false

